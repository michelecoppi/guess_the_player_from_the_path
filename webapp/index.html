<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /*
    I colori arrivano dal tema di Telegram (--tg-theme-*) quando c'e', con la palette del
    bot come ripiego: la pagina si apre dentro l'app dell'utente, e una pagina scura dentro
    un Telegram chiaro si vede subito che e' un corpo estraneo.
  */
  :root {
    --bg: var(--tg-theme-bg-color, #0a131e);
    --bg-secondary: var(--tg-theme-secondary-bg-color, #132437);
    --card: var(--tg-theme-section-bg-color, #1a2c40);
    --edge: #273e56;
    --text: var(--tg-theme-text-color, #ecf2f8);
    --muted: var(--tg-theme-hint-color, #8ea2b6);
    --accent: var(--tg-theme-button-color, #38bd82);
    --accent-text: var(--tg-theme-button-text-color, #0a1a12);
    --track: #2c445c;
    --danger: #e5484d;
    --warn: #f0a63a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 14px calc(76px + env(safe-area-inset-bottom));
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    background-image: var(--theme-pattern, none);
    min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* --- schede in fondo, come in un'app --- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--bg-secondary); border-top: 1px solid var(--edge);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    background: none; border: 0; padding: 9px 2px 11px;
    color: var(--muted); font-size: 10px; display: grid; gap: 2px; justify-items: center;
  }
  nav button .icon { font-size: 19px; line-height: 1; }
  nav button[aria-selected="true"] { color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--edge);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 10px;
  }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .error { text-align: center; padding: 48px 20px; color: var(--muted); }

  .pill {
    display: inline-block; padding: 5px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: var(--track); color: var(--text);
  }
  .pill.done { background: var(--accent); color: var(--accent-text); }
  .pill.lost { background: var(--danger); color: #fff; }

  /* --- percorso di carriera, in HTML e non come immagine --- */
  .path { display: grid; gap: 8px; }
  .stop {
    display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center;
    background: var(--bg-secondary); border-radius: 12px; padding: 10px 12px 10px 0;
    overflow: hidden;
  }
  .stop .bar { align-self: stretch; background: var(--accent); border-radius: 0 3px 3px 0; }
  .stop.loan .bar { background: repeating-linear-gradient(180deg, var(--accent) 0 5px, transparent 5px 10px); }
  /* Senza `min-width: 0` una cella di griglia non scende sotto il proprio contenuto: una
     riga come "Saudi Pro League · Arabia Saudita" spingerebbe fuori la colonna degli anni,
     che l'`overflow: hidden` del riquadro taglierebbe di netto. */
  .stop .who { min-width: 0; }
  .stop .team, .stop .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stop .team { font-weight: 700; font-size: 16px; }
  .stop .meta { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .stop .right { text-align: right; white-space: nowrap; }
  .stop .years { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stop .apps { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* --- tentativi, come i quadratini della card condivisa --- */
  .squares { font-size: 20px; letter-spacing: 3px; }

  /* --- campo di risposta --- */
  .guess-box { position: relative; }
  .guess-box input {
    width: 100%; padding: 13px 14px; border-radius: 13px;
    border: 1px solid var(--edge); background: var(--bg-secondary); color: var(--text);
    font-size: 16px; /* meno di 16px e iOS zooma da solo sul campo */
  }
  .btn {
    width: 100%; padding: 13px; border: 0; border-radius: 13px;
    background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 700;
  }
  .btn.ghost { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--edge); }
  .btn + .btn { margin-top: 8px; }
  .btn:disabled { opacity: .45; }

  .feedback { margin-top: 10px; padding: 11px 13px; border-radius: 12px; background: var(--bg-secondary); }
  .feedback.ok { background: rgba(56, 189, 130, .16); }
  .feedback.no { background: rgba(229, 72, 77, .14); }
  .feedback ul { margin: 6px 0 0; padding-left: 18px; }

  /* --- statistiche --- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--bg-secondary); border-radius: 13px; padding: 11px 13px; }
  .tile .value { font-size: 21px; font-weight: 700; }
  .tile .label { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .bars { display: grid; gap: 6px; }
  .bars .row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; }
  .bars .fill {
    background: var(--track); color: var(--text); border-radius: 5px;
    padding: 3px 7px; font-size: 12px; font-weight: 600; text-align: right;
    min-width: 26px; font-variant-numeric: tabular-nums;
  }
  .bars .fill.best { background: var(--accent); color: var(--accent-text); }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--edge);
  }
  .row:last-child { border-bottom: 0; }
  .row .pos { width: 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pts { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row.me { color: var(--accent); font-weight: 600; }

  /* --- calendario --- */
  .calendar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .day {
    border: 1px solid var(--edge); border-radius: 11px; background: var(--bg-secondary);
    padding: 8px 2px; display: grid; gap: 2px; justify-items: center;
  }
  .day .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day .mark { font-size: 15px; line-height: 1.1; }
  .day.solved { border-color: var(--accent); }
  .day.lost { border-color: var(--danger); }
  .day.recovered { border-color: var(--warn); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 10px; }

  .league-form { display: grid; gap: 8px; margin-top: 10px; }
  .league-form input {
    padding: 11px 13px; border-radius: 12px; border: 1px solid var(--edge);
    background: var(--bg-secondary); color: var(--text); font-size: 16px;
  }
  /* --- cosmetici comprati in negozio --- */
  /*
    La cornice e' un cerchio **dietro** l'avatar, non un bordo: un bordo che gira si
    porterebbe dietro anche le iniziali, e quelle devono stare ferme.
  */
  .avatar-wrap { position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
  .avatar-wrap .ring { position: absolute; inset: 0; border-radius: 50%; }
  .avatar-wrap .ring.spin { animation: ring-spin 4.5s linear infinite; }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  .avatar {
    position: relative; width: 50px; height: 50px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 19px;
    background: var(--accent); color: var(--accent-text);
  }
  .title-tag { font-size: 12.5px; font-weight: 700; margin-top: 1px; padding: 3px 8px; border-radius: 6px; width: fit-content; max-width: 100%; background: #14202d; }

  .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .shop-grid.wide { grid-template-columns: 1fr; }
  .shop-item {
    background: var(--bg-secondary); border: 1px solid var(--edge); border-radius: 13px;
    padding: 10px; display: grid; gap: 6px; align-content: start;
  }
  .shop-item.worn { border-color: var(--accent); }
  .shop-item .nm { font-weight: 700; font-size: 13.5px; }
  .shop-item .ds { font-size: 11.5px; color: var(--muted); }
  .shop-item .tag { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .btn.small { padding: 8px; font-size: 13px; border-radius: 10px; }
  .swatch { height: 32px; border-radius: 9px; border: 1px solid var(--edge); display: flex; overflow: hidden; }
  .swatch span { flex: 1; }
  .ring-preview { width: 32px; height: 32px; border-radius: 50%; padding: 4px; background: var(--track); }
  .ring-preview i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--bg-secondary); }
  .emoji-preview { font-size: 22px; line-height: 1.3; letter-spacing: 2px; }

  .shop-hero { position: relative; overflow: hidden; background: radial-gradient(ellipse at top right, #375541, transparent 75%), #142a26; color: #f0fff7; }
  .shop-hero h1 { font-size: clamp(25px, 6vw, 36px); line-height: 1.1; max-width: 310px; margin: 12px 0; }
  .shop-hero p { font-size: 13px; max-width: 440px; color: #c5dfd1; }
  .shop-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #99e7b7; }
  .shop-sparkles { position: absolute; right: 18px; top: 12px; font-size: 36px; opacity: .5; pointer-events: none; }
  .shop-pills, .pack-contents { display: flex; gap: 6px; flex-wrap: wrap; }
  .shop-pills span, .pack-contents span { border: 1px solid var(--edge); padding: 4px 8px; border-radius: 20px; font-size: 11px; }
  .shop-pills span { border-color: #466653; color: #d9f4e4; }
  .legal-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; padding: 10px 0; }
  .legal-links a { color: var(--text); text-underline-offset: 4px; font-size: 12px; min-height: 44px; display: inline-flex; align-items: center; }
  .shop-hero .legal-links a { color: #d9f4e4; }
  .shop-item { min-width: 0; padding: 12px; gap: 9px; grid-template-rows: auto auto 1fr auto; transition: border-color .2s, transform .2s; }
  .shop-item .nm, .shop-item .ds { overflow-wrap: anywhere; }
  .shop-item .ds { line-height: 1.55; }
  .shop-item .btn { min-height: 44px; }
  .shop-stage { border-radius: 12px; min-height: 132px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; text-align: center; background: radial-gradient(ellipse at top, var(--track), transparent), var(--bg); }
  .shop-stage .preview-name { font-size: 12px; font-weight: 700; max-width: 100%; overflow-wrap: anywhere; }
  .shop-stage .emoji-preview { font-size: 28px; }
  .shop-stage .avatar-wrap { flex-shrink: 0; }
  .preview-caption { font-size: 10px; opacity: .75; letter-spacing: .06em; text-transform: uppercase; }
  .mini-pitch { width: 90px; height: 43px; border: 1px solid currentColor; border-radius: 5px; position: relative; opacity: .55; }
  .mini-pitch::before { content: ''; position: absolute; left: 50%; top: 0; height: 100%; border-left: 1px solid currentColor; }
  .mini-pitch::after { content: ''; position: absolute; width: 20px; height: 20px; border: 1px solid currentColor; border-radius: 50%; left: calc(50% - 10px); top: 10px; }
  .pack-contents { padding: 4px 0; }
  .shop-shortcuts { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin-bottom: 4px; }
  .shop-shortcuts a { flex-shrink: 0; color: var(--text); background: var(--card); border: 1px solid var(--edge); border-radius: 24px; padding: 11px 15px; font-size: 12px; text-decoration: none; }
  [id^="shelf-"] { scroll-margin-top: 12px; }
  .shop-set-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 9px; color: var(--accent); }
  .shop-item.featured .shop-stage { min-height: 190px; background-size: cover; }
  .shop-controls { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
  .shop-controls button, .shop-controls select, .shop-controls input:not([type="checkbox"]) { border:1px solid var(--edge); background:var(--card); color:var(--text); border-radius:10px; padding:10px; min-height:44px; max-width:100%; }
  .shop-controls label { display:flex; align-items:center; gap:8px; min-height:44px; font-size:13px; }
  button.profile-link { background:none; border:0; padding:10px 0; min-height:44px; color:inherit; text-align:left; text-decoration:underline; text-underline-offset:4px; cursor:pointer; }
  .profile-search { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
  .profile-search input { min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--edge); background:var(--bg-secondary); color:var(--text); font-size:16px; }
  .profile-search .btn { width:auto; padding-inline:18px; }
  .profile-search-results { margin-top:8px; }
  .public-profile { background-color:var(--bg); background-image:var(--theme-pattern,none); color:var(--text); padding:14px; border-radius:18px; }
  .public-profile .profile-hero { display:flex; gap:16px; align-items:center; padding:24px 16px; }
  .public-profile .profile-hero > .avatar-wrap { flex:0 0 58px; }
  .public-profile .profile-hero > div:last-child { min-width:0; flex:1 1 auto; }
  .public-profile h1 { overflow-wrap:anywhere; font-size:24px; }
  .shop-controls button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .preview-bar { position:sticky; top:0; z-index:9; background:var(--card); border:2px solid var(--accent); padding:12px; border-radius:14px; margin-bottom:12px; }
  .preview-person { display:flex; gap:12px; align-items:center; margin:8px 0; }
  .shop-note { font-size:12px; color:var(--muted); }
  .shop-item progress { width:100%; accent-color:var(--accent); }
  .history-command { width:100%; min-height:90px; border:1px solid var(--edge); border-radius:8px; padding:10px; background:var(--bg); color:var(--text); overflow-wrap:anywhere; }
  @media (min-width: 900px) { #shelf-collections .shop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (hover: hover) { .shop-item:hover { transform: translateY(-2px); border-color: var(--accent); } }
  @media (max-width: 350px) { .shop-grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .avatar-wrap .ring.spin { animation: none; } .shop-item { transition: none; } }

  /* Shop: compact navigation, collectible covers and scoped theme-aware surfaces. */
  .shop-shell { max-width:1120px; margin:0 auto; --shop-surface:color-mix(in srgb,var(--card) 70%,var(--bg)); }
  .shop-shell .shop-hero { border:0; border-radius:0; padding:16px 2px 8px; margin:0 0 12px; background:none; color:var(--text); }
  .shop-shell .shop-heading { position:relative; z-index:1; max-width:76%; }
  .shop-shell .shop-kicker { font-size:9px; letter-spacing:.16em; color:var(--muted); font-weight:700; }
  .shop-shell .shop-kicker span { color:var(--accent); }
  .shop-shell .shop-hero h1 { font-size:clamp(29px,7vw,46px); font-weight:850; letter-spacing:-.055em; line-height:1.03; margin:16px 0 12px; max-width:380px; }
  .shop-shell .shop-hero p { font-size:12px; line-height:1.6; color:var(--muted); margin:0; max-width:360px; }
  .shop-pitch-art { position:absolute; right:-32px; top:22px; width:145px; height:180px; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); border-radius:14px; transform:rotate(-18deg); background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent); }
  .pitch-circle { position:absolute; width:62px; height:62px; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); border-radius:50%; left:40px; top:59px; }
  .pitch-line { position:absolute; left:0; right:0; top:89px; border-top:1px solid color-mix(in srgb,var(--accent) 35%,transparent); }
  .pitch-ball { position:absolute; right:23px; top:16px; color:var(--accent); font-size:54px; line-height:1; }
  .shop-trust { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0 12px; margin-top:17px; position:relative; z-index:1; }
  .shop-trust details { font-size:10px; color:var(--muted); max-width:100%; }
  .shop-trust summary { cursor:pointer; padding:8px 0; list-style:none; }
  .shop-trust summary span { opacity:.8; }
  .shop-trust details[open] { flex-basis:100%; }
  .shop-shell .shop-trust .legal-links { padding:0; gap:12px; justify-content:flex-start; }
  .shop-shell .shop-trust .legal-links a { color:var(--muted); font-size:10px; min-height:36px; }
  .shop-shell .shop-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding:4px; gap:3px; background:var(--shop-surface); border:1px solid var(--edge); border-radius:15px; margin:0 0 16px; }
  .shop-shell .shop-tabs button { display:flex; flex-direction:column; gap:3px; align-items:center; justify-content:center; border:0; border-radius:11px; padding:8px 2px; font-size:11px; font-weight:650; color:var(--muted); background:transparent; min-height:58px; }
  .shop-shell .shop-tabs button[aria-pressed="true"] { color:var(--accent-text); background:var(--accent); box-shadow:0 3px 12px #0002; }
  .shop-tab-icon { font-size:20px; line-height:1; font-weight:400; }
  .shop-shell .shop-filters { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; margin:0 0 12px; }
  .shop-shell .shop-filters select { width:100%; background:var(--card); border-color:var(--edge); font-size:11px; border-radius:9px; padding:8px; }
  /* La tendina di un <select> la disegna il browser, non noi: con lo sfondo trasparente la
     apriva bianca e ci scriveva sopra il colore del tema, che sui temi scuri e' bianco.
     Le voci vogliono i due colori scritti a mano, e devono venire dal tema indossato -
     cosi' funzionano sia sui temi scuri sia su Ghiaccio e Carta ingiallita. */
  .shop-controls select option { background-color: var(--card); color: var(--text); }
  .shop-shell .shop-filters label { grid-column:1 / -1; font-size:11px; min-height:32px; }
  .shop-shell .shop-filters input[type="checkbox"] { accent-color:var(--accent); }
  .shop-shell .shop-shortcuts { gap:7px; padding:0 1px 12px; scrollbar-width:none; }
  .shop-shell .shop-shortcuts::-webkit-scrollbar { display:none; }
  .shop-shell .shop-shortcuts a { font-size:11px; font-weight:600; background:transparent; padding:10px 14px; border-radius:30px; }
  .shop-shell .shop-shortcuts a:hover { border-color:var(--accent); }
  .shop-shell .shop-section { padding:0; margin:16px 0 28px; background:none; border:0; }
  .shop-section-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .shop-shell .shop-section h2 { margin:0; font-size:16px; color:var(--text); text-transform:none; letter-spacing:-.025em; font-weight:750; }
  .shop-section-heading > span { font-size:11px; color:var(--muted); border:1px solid var(--edge); border-radius:20px; min-width:28px; text-align:center; padding:3px 6px; }
  .shop-shell .shop-grid { gap:12px; align-items:stretch; }
  .shop-shell .shop-item { border-radius:18px; padding:0; gap:0; background:var(--shop-surface); border:1px solid var(--edge); overflow:hidden; box-shadow:0 5px 18px #0001; }
  .shop-shell .shop-item.worn { border-color:var(--accent); }
  .shop-shell .shop-artwork { position:relative; padding:8px; }
  .shop-shell .shop-stage { min-height:175px; border-radius:12px; gap:10px; padding:28px 10px 36px; background:radial-gradient(ellipse at 50% 25%,color-mix(in srgb,var(--accent) 10%,var(--bg)),var(--bg)); }
  .shop-shell .shop-stage .preview-caption { display:none; }
  .shop-shell .shop-stage .preview-name { font-size:11px; opacity:.85; }
  .shop-shell .shop-stage .avatar-wrap { transform:scale(1.15); margin:8px 0; }
  .shop-shell .shop-stage .emoji-preview { font-size:30px; }
  .shop-shell .shop-stage .title-tag { font-size:11px; }
  .shop-shell .mini-pitch { width:110px; height:55px; }
  .shop-shell .mini-pitch::after { top:16px; }
  .shop-preview-trigger { position:absolute; bottom:16px; right:16px; border:1px solid #ffffff40; background:#101824; color:#f1f5fb; border-radius:30px; min-height:44px; padding:7px 12px; font:inherit; font-size:11px; font-weight:600; cursor:pointer; }
  .shop-preview-trigger span { margin-left:6px; }
  .shop-product-head { padding:10px 12px 6px; }
  .shop-product-kind { display:block; color:var(--muted); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.13em; margin-bottom:6px; }
  .shop-shell .shop-item .nm { font-size:14px; line-height:1.3; letter-spacing:-.02em; font-weight:750; }
  .shop-shell .shop-item .ds { padding:0 12px; font-size:11px; }
  .shop-product-details summary { cursor:pointer; color:var(--muted); padding:8px 0; min-height:36px; font-size:10px; }
  .shop-product-details p { margin:4px 0 10px; }
  .shop-product-details .pack-contents { margin-bottom:8px; }
  .shop-product-details .pack-contents span { font-size:10px; }
  .shop-completion { border-left:2px solid var(--accent); padding-left:8px; }
  .shop-unlocked { color:var(--accent); }
  .shop-product-actions { padding:10px 12px 12px; display:grid; gap:6px; align-content:end; }

  /* --- trofei appesi al profilo (services/trophies.py) --- */

  /* --- la bacheca a schermo intero --- */

    width: 100%; text-align: left; font: inherit; color: var(--text); min-height: 56px;
    background: var(--card); border: 1px solid var(--edge); border-left: 3px solid var(--plate);

  .cabinet-row .medal { font-size: 21px; line-height: 1; text-align: center; }
  .cabinet-row .nm { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .cabinet-row .ds { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cabinet-row .pin { font-size: 11px; color: var(--muted); border: 1px solid var(--edge); border-radius: 20px; padding: 5px 9px; white-space: nowrap; }
  .cabinet-row[aria-pressed="true"] { background: var(--track); }
  .cabinet-row[aria-pressed="true"] .pin { color: var(--plate); border-color: var(--plate); }

  .cabinet-pinned { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--edge); }

  @media (min-width: 620px) { .cabinet-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* --- rarita', numero di maglia, festeggiamento --- */

  /* La figurina in miniatura: le stesse tre finiture che disegna services/path_image.py. */
  .fig-mini { position: relative; width: 104px; aspect-ratio: 4/5; border-radius: 9px; overflow: hidden;
    background: var(--paper); color: var(--ink); display: flex; flex-direction: column;

  .fig-mini .n { font-size: 10px; opacity: .7; letter-spacing: .05em; }

<body>
<div id="root"><p class="error">…</p></div>
<script src="/app/client.js"></script>
<script src="/app/strings.js"></script>
<script>
"use strict";

// Le funzioni pure stanno in webapp/client.js, caricato qui sopra: sono le uniche che
// i test possono eseguire senza un browser (tests/client.test.cjs).
const { escapeHtml, initials, mergeProfile, histogram, cabinetCounts,
        languageFromCode, weekNumber } = PlayerClient;
// Le tre tabelle di stringhe stanno in webapp/strings.js: fuori di qui perche' la parita'
// fra le lingue e' verificata da `node --test` (tests/client.test.cjs).
const { T, PUBLIC_TEXT, SHOP_I18N } = PlayerStrings;

/*
  La mini app: quattro schede sopra le stesse regole del bot.

  Due cose che non sono dettagli:

  - **il server non manda mai la risposta**. Il percorso arriva senza nome e senza
    `player_id`, e gli indizi arrivano solo dopo che sono stati pagati: chi apre gli
    strumenti di sviluppo non trova niente che non abbia gia' guadagnato;
  - **le regole non sono qui**. Punti, tentativi, costo degli indizi e striscia li decide
    services/game.py, cioe' lo stesso codice della chat. Questa pagina disegna e basta.
*/

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }


let L = T[clientLanguage()] || T.en;

function clientLanguage() {
  return languageFromCode(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code);
}

// ---------------------------------------------------------------------------
// Stato
// ---------------------------------------------------------------------------

const state = {
  tab: "play",
  profile: null,
  calendar: null,
  archiveDay: null,    // giornata passata aperta dentro l'archivio
  feedback: null,      // esito dell'ultimo tentativo
  hint: null,          // ultimo indizio ricevuto
  shop: null,          // vetrina del negozio, caricata alla prima apertura
  shopView: "catalog", shopKind: "all", shopPrice: "all", shopHideOwned: false,
  publicTarget: null, publicProfile: null, publicError: false, profileScroll: 0,
  profileQuery: "", profileResults: null, profileSearchLoading: false, profileSearchError: false,
  preview: null, previewName: "", history: null, historyError: false, shopError: false,
  toast: null,
};

// I simboli del risultato: quelli classici finche' non se ne compra un altro set
// (services/shop.py). Non e' una costante proprio per questo.
let SQUARES = { correct: "🟩", wrong: "🟥", unused: "⬜" };

// Nome della variabile CSS per ogni colore del tema. La pagina nasce con la palette del bot
// scritta su `:root`; un tema comprato la sovrascrive sull'elemento radice, e toglierla
// rimette esattamente quella di prima.
const THEME_VARS = {
  bg: "--bg", bg2: "--bg-secondary", card: "--card", edge: "--edge", text: "--text",
  muted: "--muted", accent: "--accent", accentText: "--accent-text", track: "--track",
  pattern: "--theme-pattern",
};

function cosmetics() {
  return state.preview || (state.profile && state.profile.cosmetics) || {};
}

function applyCosmetics(worn) {
  const style = document.documentElement.style;
  const theme = (worn && worn.theme) || {};
  Object.keys(THEME_VARS).forEach(key => {
    if (theme[key]) style.setProperty(THEME_VARS[key], theme[key]);
    else style.removeProperty(THEME_VARS[key]);
  });
  const squares = (worn && worn.squares) || {};
  SQUARES = {
    correct: squares.correct || "🟩",
    wrong: squares.wrong || "🟥",
    unused: squares.unused || "⬜",
  };
}

function haptic(kind) {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) { /* non essenziale */ }
}

async function api(path, body) {
  const initData = tg && tg.initData;
  if (!initData) throw new Error("no-initdata");
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, body || {})),
  });
  if (!response.ok) throw Object.assign(new Error("http"), { status: response.status });
  return response.json();
}

function toast(text) {
  state.toast = text;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2600);
}

// ---------------------------------------------------------------------------
// Pezzi di interfaccia
// ---------------------------------------------------------------------------

function squares(used, max, solved) {
  return PlayerClient.squares(used, max, solved, SQUARES);
}

/*
  Il percorso disegnato in HTML invece che come immagine. Le convenzioni sono quelle della
  card generata dal bot (services/path_image.py): freccia e barra tratteggiata per un
  prestito, puntini per una tappa ancora in corso, presenze con i gol fra parentesi. Il
  paese arriva gia' tradotto dal server.
*/
function careerPath(stops) {
  if (!stops || !stops.length) return "";
  const rows = stops.map(stop => {
    const meta = [stop.league, stop.country].filter(Boolean).map(escapeHtml).join(" · ");
    const years = stop.end_year ? `${stop.start_year} – ${stop.end_year}` : `${stop.start_year} – …`;
    const apps = stop.apps == null ? "" : (stop.goals == null ? `${stop.apps}` : `${stop.apps} (${stop.goals})`);
    return `<div class="stop${stop.loan ? " loan" : ""}">
      <div class="bar"></div>
      <div class="who">
        <div class="team">${escapeHtml(stop.team)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
      </div>
      <div class="right">
        <div class="years">${stop.loan ? "→ " : ""}${escapeHtml(years)}</div>
        ${apps ? `<div class="apps">${escapeHtml(apps)}</div>` : ""}
      </div>
    </div>`;
  }).join("");
  return `<div class="path">${rows}</div>`;
}

function guessBox(disabled) {
  return `<div class="guess-box">
    <input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="words"
           placeholder="${escapeHtml(L.placeholder)}" ${disabled ? "disabled" : ""}>
  </div>
  ${tg ? "" : `<button class="btn" id="submit" style="margin-top:10px" ${disabled ? "disabled" : ""}>${escapeHtml(L.guessBtn)}</button>`}`;
}

/*
  Il confronto dopo un tentativo sbagliato. Il server manda le **chiavi** delle voci (le
  stesse che il bot traduce con services/i18n.py), non il testo: cosi' la pagina puo'
  scriverle nella lingua giusta senza che il server sappia niente di questa interfaccia.
*/
const CLUES = {
  "feedback.nationality_same": () => L.sameNat,
  "feedback.nationality_diff": () => L.diffNat,
  "feedback.position_same": () => L.samePos,
  "feedback.position_diff": () => L.diffPos,
  "feedback.birth_same": a => `${L.sameYear} ${a.year}`,
  "feedback.birth_before": a => `${L.older} ${a.year}`,
  "feedback.birth_after": a => `${L.younger} ${a.year}`,
};

function comparison(data) {
  if (!data) return "";
  const items = (data.clues || []).map(([key, args]) => {
    const render = CLUES[key];
    return render ? `<li>${escapeHtml(render(args || {}))}</li>` : "";
  }).join("");
  return `<div>${escapeHtml(L.compared)} <b>${escapeHtml(data.name)}</b>:<ul>${items}</ul></div>`;
}

function feedbackBox() {
  const f = state.feedback;
  if (!f) return "";
  if (f.status === "correct") {
    return `<div class="feedback ok"><b>${escapeHtml(L.correct)}</b> ${f.points_awarded} ${escapeHtml(L.gotPoints)}.
      ${f.share ? `<button class="btn ghost" style="margin-top:10px" id="share">${escapeHtml(L.share)}</button>${resultCard()}` : ""}</div>`;
  }
  if (f.status === "wrong") {
    // `answer` c'e' solo per le giornate d'archivio: quella di oggi non si rivela mai,
    // perche' e' ancora in gioco per tutti gli altri.
    let tail;
    if (f.attempts_left > 0) tail = `${escapeHtml(L.left)}: ${f.attempts_left}.`;
    else if (f.answer) tail = `<b>${escapeHtml(L.answerWas)} ${escapeHtml(f.answer)}</b>`;
    else tail = escapeHtml(L.outOfAttempts);
    return `<div class="feedback no">
      <b>${escapeHtml(L.wrong)}</b> ${tail}
      ${comparison(f.comparison)}
      ${f.share ? `<button class="btn ghost" style="margin-top:10px" id="share">${escapeHtml(L.share)}</button>${resultCard()}` : ""}
    </div>`;
  }
  if (f.status === "refused") return `<div class="feedback no">${escapeHtml(L.already)}</div>`;
  return "";
}

function hintBox(hints) {
  if (!hints || !hints.total) return `<p class="muted center" style="margin:12px 0 0">${escapeHtml(L.noHints)}</p>`;
  // `taken` sono gli indizi gia' pagati, resi dal server nella lingua dell'utente: quelli
  // non ancora presi non arrivano proprio, altrimenti si leggerebbero gratis dalla rete.
  const taken = (hints.taken || []).map(text => `<div class="feedback">${text}</div>`).join("");
  const left = hints.total - hints.used;
  return `${taken}
    ${left > 0 ? `<button class="btn ghost" id="hint" style="margin-top:10px">${escapeHtml(L.hintBtn)}</button>
      <p class="muted center" style="margin:6px 0 0;font-size:12px">${left} ${escapeHtml(L.hintsLeft)}</p>` : ""}`;
}

// ---------------------------------------------------------------------------
// Schede
// ---------------------------------------------------------------------------

function playTab() {
  const today = state.profile.today;
  if (!today.available) return `<div class="card center muted">${escapeHtml(L.none)}</div>`;

  const done = today.solved || today.attempts_left === 0;
  const status = today.solved
    ? `<span class="pill done">${escapeHtml(L.solved)}</span>`
    : today.attempts_used
      ? `<span class="pill">${escapeHtml(L.left)}: ${today.attempts_left}</span>`
      : `<span class="pill">${escapeHtml(L.notPlayed)}</span>`;

  return `<div class="card">
      <h2>${escapeHtml(L.todayTitle)} #${today.number}</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>
          <div><b>${escapeHtml(today.difficulty_label)}</b> · ${today.points} ${escapeHtml(L.points)}</div>
          <div class="squares">${squares(today.attempts_used, today.max_attempts, today.solved)}</div>
        </div>
        ${status}
      </div>
      ${today.bonus_available && !done ? `<p class="muted" style="margin:8px 0 0;font-size:12.5px">${escapeHtml(L.bonus)}</p>` : ""}
    </div>
    <div class="card">${careerPath(today.career_path)}</div>
    <div class="card">
      ${done ? "" : guessBox(false)}
      ${feedbackBox()}
      ${done ? "" : hintBox(today.hints)}
    </div>`;
}

function archiveTab() {
  if (state.archiveDay) return archiveDayView(state.archiveDay);

  const days = state.calendar;
  if (!days) return `<div class="card center muted">${escapeHtml(L.loading)}</div>`;
  if (!days.length) return `<div class="card center muted">${escapeHtml(L.noArchive)}</div>`;

  const marks = { solved: "✅", lost: "❌", recovered: "🟡", missed: "·" };
  const cells = days.map(day => `<button class="day ${day.status}" data-day="${escapeHtml(day.day)}">
      <span class="mark">${marks[day.status]}</span>
      <span class="n">#${day.number}</span>
    </button>`).join("");

  return `<div class="card">
    <h2>${escapeHtml(L.calendarTitle)}</h2>
    <div class="calendar">${cells}</div>
    <div class="legend">
      <span>✅ ${escapeHtml(L.legendSolved)}</span><span>❌ ${escapeHtml(L.legendLost)}</span>
      <span>🟡 ${escapeHtml(L.legendRecovered)}</span><span>· ${escapeHtml(L.legendMissed)}</span>
    </div>
    <p class="muted" style="margin:10px 0 0;font-size:12.5px">${escapeHtml(L.archiveNote)}</p>
  </div>`;
}

function archiveDayView(day) {
  const done = day.solved || day.attempts_left === 0;
  return `<div class="card">
      <h2>#${day.number} · ${escapeHtml(day.label)}</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>
          <div><b>${escapeHtml(day.difficulty_label)}</b></div>
          <div class="squares">${squares(day.attempts_used, day.max_attempts, day.solved)}</div>
        </div>
        ${day.solved ? `<span class="pill done">${escapeHtml(L.solved)}</span>` : ""}
      </div>
    </div>
    <div class="card">${careerPath(day.career_path)}</div>
    <div class="card">
      ${done ? "" : guessBox(false)}
      ${feedbackBox()}
      <button class="btn ghost" id="back" style="margin-top:10px">${escapeHtml(L.back)}</button>
    </div>`;
}

function publicText() { return PUBLIC_TEXT[state.profile.language] || PUBLIC_TEXT.en; }
// Il numero di maglia sta **prima** del nome e il distintivo dopo: sono due cose diverse -
// uno e' un'identita' (lo porti addosso), l'altro un ornamento - e messi dalla stessa parte
// diventerebbero una fila di simboli senza ordine.
function shirtTag(number) {
  return number ? `<span class="shirt">${escapeHtml(number)}</span>` : "";
}

function profileLink(row) {
  const name = (row.badge ? row.badge + " " : "") + row.name;
  return Number.isSafeInteger(row.profile_id) && row.profile_id > 0
    ? `<button class="name profile-link" data-profile="${row.profile_id}" aria-label="${escapeHtml(publicText().open + ' · ' + row.name)}">${escapeHtml(name)}</button>`
    : `<span class="name">${escapeHtml(name)}</span>`;
}
async function openPublicProfile(id) {
  if (!state.publicTarget) state.profileScroll = window.scrollY;
  state.publicTarget = id; state.publicProfile = null; state.publicError = false;
  render(); window.scrollTo(0,0);
  try {
    const profile = await api("/app/api/profile/public", {profile_id:id});
    if (state.publicTarget !== id) return;
    state.publicProfile = profile;
  } catch (e) { if (state.publicTarget !== id) return; state.publicError = true; }
  render();
  const heading = document.getElementById("public-heading");
  if (heading) heading.focus({preventScroll:true});
}

function trophyTag(tag, options) {
  const picking = options && options.picking;
  const tagName = picking ? "button" : "span";
  const attrs = picking
    ? ` type="button" class="trophy-tag pickable" data-pin="${escapeHtml(tag.code)}" aria-pressed="${!!options.chosen}"`
    : ` class="trophy-tag"`;
  return `<${tagName}${attrs} style="--plate:${escapeHtml(tag.color)}">
      <span class="medal" aria-hidden="true">${escapeHtml(tag.medal)}</span>
      <span class="plate-name">${escapeHtml(tag.label)}</span>
      <span class="plate-detail">${escapeHtml(tag.detail)}</span>
    </${tagName}>`;
}

function trophyTags(tags) {
  if (!tags || !tags.length) return "";
  return `<div class="trophy-tags">${tags.map(tag => trophyTag(tag)).join("")}</div>`;
}

// La bacheca. E' una schermata sua e non una card in mezzo alle statistiche: con quattro
// trofei una fila di targhe funziona, con quaranta diventa un muro in cui il primo posto
// vinto due anni fa sta in mezzo a dieci terzi posti. Qui il conto sta in alto, i filtri
// tolgono il grosso, e i trofei sono raggruppati per anno - che e' il modo in cui uno se li
// ricorda.
function cabinetData() {
  return state.profile.trophies || {};
}

function chosenCodes() {
  return state.pinning || (cabinetData().pinned || []).map(tag => tag.code);
}

function cabinetView() {
  const data = cabinetData();
  const all = data.all || [];
  const max = data.max || 3;
  const chosen = chosenCodes();
  const back = `<button class="btn ghost" id="close-cabinet">← ${escapeHtml(L.cabinetBack)}</button>`;
  if (!all.length) {
    return back + `<div class="card"><h2>${escapeHtml(L.cabinetTitle)}</h2><p class="muted" style="margin:0">${escapeHtml(L.noTrophies)}</p></div>`;
  }

  const counts = cabinetCounts(all);
  const medals = [["#e8b647", counts[0], L.cabinetGold], ["#c3ccd6", counts[1], L.cabinetSilver],
                  ["#c98652", counts[2], L.cabinetBronze]];
  const filters = [["all", L.cabinetAll], ["1", "🥇"], ["2", "🥈"], ["3", "🥉"],
                   ["event", L.cabinetEvents], ["monthly", L.cabinetMonthly]];
  const active = state.cabinetFilter || "all";
  const matches = tag => active === "all" || String(tag.position) === active || tag.kind === active;
  const shown = all.filter(matches);

  // Raggruppati per anno, dal piu' recente: dentro l'anno resta l'ordine della bacheca, che
  // mette prima i piazzamenti migliori.
  const years = [];
  for (const tag of shown) {
    const last = years[years.length - 1];
    if (last && last.year === tag.year) last.items.push(tag);
    else years.push({year: tag.year, items: [tag]});
  }
  years.sort((a, b) => Number(b.year) - Number(a.year));

  const pinned = (data.pinned || []).map(tag => trophyTag(tag)).join("");
  return back + `<section aria-label="${escapeHtml(L.cabinetTitle)}">
    <div class="card">
      <div class="cabinet-head"><h1 style="font-size:23px;margin:0">${escapeHtml(L.cabinetTitle)}</h1>
        <span class="muted" style="font-size:13px">${all.length} ${escapeHtml(L.trophies)}</span></div>
      <div class="cabinet-medals">${medals.map(([color, value, label]) => `<div class="cabinet-medal" style="--plate:${color}"><div class="value">${value}</div><div class="label">${escapeHtml(label)}</div></div>`).join("")}</div>
    </div>
    ${pinned ? `<div class="card cabinet-pinned"><div class="cap">${escapeHtml(L.cabinetPinned)}</div><div class="trophy-tags">${pinned}</div></div>` : ""}
    <div class="card">
      <p class="shop-note" style="margin:0 0 8px">${escapeHtml(L.cabinetHint.replace("{n}", max))}</p>
      <div class="cabinet-filters">${filters.map(([key, label]) => `<button data-cabinet-filter="${escapeHtml(key)}" aria-pressed="${active === key}">${escapeHtml(label)}</button>`).join("")}</div>
      ${shown.length ? years.map(group => `<div class="cabinet-year">${escapeHtml(group.year)}</div>
        <div class="cabinet-list">${group.items.map(tag => cabinetRow(tag, chosen.indexOf(tag.code) >= 0)).join("")}</div>`).join("")
        : `<p class="cabinet-empty">${escapeHtml(L.cabinetNone)}</p>`}
    </div>
  </section>`;
}

function cabinetRow(tag, chosen) {
  return `<button type="button" class="cabinet-row" data-pin="${escapeHtml(tag.code)}" aria-pressed="${!!chosen}" style="--plate:${escapeHtml(tag.color)}">
      <span class="medal" aria-hidden="true">${escapeHtml(tag.medal)}</span>
      <span><span class="nm">${escapeHtml(tag.label)}</span><span class="ds">${escapeHtml(tag.detail)}</span></span>
      <span class="pin">${escapeHtml(chosen ? L.cabinetPinned : L.cabinetPin)}</span>
    </button>`;
}

async function togglePin(code) {
  const data = cabinetData();
  const max = data.max || 3;
  const chosen = chosenCodes().slice();
  const at = chosen.indexOf(code);
  if (at >= 0) chosen.splice(at, 1);
  else if (chosen.length >= max) { toast(L.pinFull.replace("{n}", max)); return; }
  else chosen.push(code);

  state.pinning = chosen;
  render();
  try {
    const result = await api("/app/api/trophies/pin", { codes: chosen });
    if (result.status !== "ok") { state.pinning = null; toast(L.loadError || "…"); render(); return; }
    state.profile.trophies = Object.assign({}, data, { pinned: result.pinned });
    state.pinning = null;
    haptic("success");
    render();
  } catch (e) {
    state.pinning = null;
    render();
  }
}

function avatar(name, frame) {

/*
  Il negozio. Ogni riquadro mostra **come si vedra'** l'oggetto - la striscia di colori di un
  tema, il cerchio di una cornice, i tre simboli di un set di quadratini - perche' un nome
  come "Terra rossa" da solo non dice niente a chi deve decidere se spenderci sopra.

  Il prezzo lo scrive il server: qui si manda solo l'id di quello che si vuole comprare.
*/
function shopText() { return SHOP_I18N[(state.profile || {}).language] || SHOP_I18N.en; }

function shopTab() {
  const s = shopText();
  const shell = content => `<section class="shop-shell">${content}</section>`;
  if (state.shopError) return `<div class="card">${escapeHtml(s.loadError)}<button class="btn" id="shop-retry">${escapeHtml(s.retry)}</button></div>`;
  if (!state.shop) return `<div class="card center muted">${escapeHtml(L.loading)}</div>`;

  const intro = `<header class="shop-hero">
      <div class="shop-heading"><span class="shop-kicker">GUESS THE PLAYER <span>/ ${escapeHtml(L.shop)}</span></span>
      <h1>${escapeHtml(L.shopHeadline)}</h1>
      <p>${escapeHtml(L.shopSubtitle)}</p></div>
      <div class="shop-pitch-art" aria-hidden="true"><span class="pitch-circle"></span><span class="pitch-line"></span><span class="pitch-ball">✦</span></div>
      <div class="shop-trust"><details><summary>✦ ${escapeHtml(L.shopCosmetics)} <span>· Telegram Stars</span></summary><p>${escapeHtml(L.shopFair)}</p></details>${legalLinks()}</div>
    </header>`;
  const tabs = `<div class="shop-controls shop-tabs">${["catalog","wardrobe","achievements","history"].map(view => `<button data-shop-view="${view}" aria-pressed="${state.shopView === view}"><span class="shop-tab-icon" aria-hidden="true">${({catalog:"◇",wardrobe:"▣",achievements:"✧",history:"≡"})[view]}</span>${escapeHtml(s[view])}</button>`).join("")}</div>`;
  if (state.shopView === "history") return shell(intro + tabs + purchaseHistory());
  const filters = `<div class="shop-controls shop-filters"><select id="shop-kind" aria-label="${escapeHtml(s.all)}"><option value="all">${escapeHtml(s.all)}</option>${Object.entries(L.shopSections).map(([key,label]) => `<option value="${key}" ${state.shopKind === key ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select>
    <select id="shop-price" aria-label="${escapeHtml(s.anyPrice)}"><option value="all">${escapeHtml(s.anyPrice)}</option>${[15,25,55,75].map(price => `<option value="${price}" ${state.shopPrice === String(price) ? "selected" : ""}>≤ ${price} ⭐</option>`).join("")}</select>
    ${state.shopView === "catalog" ? `<label><input id="shop-hide-owned" type="checkbox" ${state.shopHideOwned ? "checked" : ""}> ${escapeHtml(s.hideOwned)}</label>` : ""}</div>`;
  const matches = item => (state.shopKind === "all" || state.shopKind === item.kind) &&
    (state.shopPrice === "all" || item.price <= Number(state.shopPrice)) &&
    (state.shopView !== "wardrobe" || item.owned) &&
    (state.shopView !== "achievements" || item.achievement) &&
    (state.shopView !== "catalog" || (!item.achievement && (!state.shopHideOwned || !item.owned)));
  const visiblePacks = state.shop.bundles.filter(matches);
  const visibleSections = state.shop.sections.map(section => ({kind:section.kind, items:section.items.filter(matches)})).filter(section => section.items.length);
  const featured = visiblePacks.filter(item => item.featured);
  const regular = visiblePacks.filter(item => !item.featured);
  const collections = featured.length ? shopSection("bundle", featured, L.shopCollections, "collections") : "";
  const packs = regular.length ? shopSection("bundle", regular) : "";
  const shelves = visibleSections.map(section => shopSection(section.kind, section.items)).join("");
  const kinds = (regular.length ? ["bundle"] : []).concat(visibleSections.map(section => section.kind));
  const shortcuts = `<div class="shop-shortcuts">${featured.length ? `<a href="#shelf-collections">${escapeHtml(L.shopCollectionNav)}</a>` : ""}${kinds.map(kind => `<a href="#shelf-${escapeHtml(kind)}">${escapeHtml(L.shopSections[kind])}</a>`).join("")}</div>`;
  const window_ = state.shopView === "catalog" ? weeklyWindow() : "";
  return shell(intro + tabs + (state.shopView === "wardrobe" ? savedLooks() : "") + window_ + filters + shortcuts +
    (collections + packs + shelves || `<p class="card">${escapeHtml(s.empty)}</p>`));
}

// Tre oggetti che cambiano ogni lunedi'. Sono gli stessi per tutti e si ricavano dalla
// settimana (services/shop.py): non c'e' niente da scrivere e niente da far girare a
// mezzanotte, quindi non c'e' niente che possa restare indietro.
function weeklyWindow() {
  const window_ = (state.shop || {}).showcase;
  if (!window_ || !window_.items || !window_.items.length) return "";
  const week = weekNumber(window_.week);
  return `<div class="card shop-section" id="shelf-showcase">
    <div class="showcase-strip"><h2>${escapeHtml(L.showcaseTitle)}</h2><span class="when">${escapeHtml(L.showcaseWeek.replace("{n}", week))}</span></div>
    <div class="shop-grid">${window_.items.map(item => shopCell(item.kind, item)).join("")}</div>
  </div>`;
}

function savedLooks() {
  const s = shopText();
  return `<div class="card"><h2>${escapeHtml(s.looks)}</h2><div class="shop-controls"><input id="look-name" maxlength="30" aria-label="${escapeHtml(s.name)}" placeholder="${escapeHtml(s.name)}"><button id="save-look" ${state.preview ? "disabled" : ""}>${escapeHtml(s.save)}</button></div>
    ${(state.shop.looks || []).map(look => `<div class="shop-controls"><span>${escapeHtml(look.name)}</span><button data-use-look="${escapeHtml(look.name)}">${escapeHtml(L.shopWear)}</button><button data-delete-look="${escapeHtml(look.name)}">${escapeHtml(s.remove)}</button></div>`).join("")}</div>`;
}

function purchaseHistory() {
  const s = shopText();
  if (state.historyError) return `<div class="card">${escapeHtml(s.loadError)}<button class="btn" id="history-retry">${escapeHtml(s.retry)}</button></div>`;
  if (!state.history) return `<p class="card">${escapeHtml(L.loading)}</p>`;
  if (!state.history.purchases.length) return `<p class="card">${escapeHtml(s.noHistory)}</p>`;
  return state.history.purchases.map((purchase, index) => `<div class="card"><b>${escapeHtml(purchase.name)}</b><p>${escapeHtml(purchase.day)} · ${escapeHtml(purchase.stars)} ⭐ · ${escapeHtml(purchase.refunded ? s.refunded : s.paid)}</p>
    <details><summary>${escapeHtml(s.support)}</summary><p class="shop-note">${escapeHtml(s.supportHint)}</p><textarea class="history-command" id="support-${index}" readonly aria-label="${escapeHtml(s.support)}">${escapeHtml('/paysupport ' + s.supportRequest + ' ' + purchase.charge_id)}</textarea><button class="btn ghost" data-copy-support="${index}">${escapeHtml(s.copy)}</button>${state.history.support_url ? `<a class="btn ghost" href="${escapeHtml(state.history.support_url)}" target="_blank" rel="noopener">${escapeHtml(s.openBot)}</a>` : ""}</details></div>`).join("");
}

function allShopItems() {
  if (!state.shop) return [];
  return state.shop.bundles.concat(...state.shop.sections.map(section => section.items), ...state.shop.bundles.map(pack => pack.contents || []));
}

function tryItem(id) {
  const item = allShopItems().find(one => one.id === id);
  if (!item) return;
  const worn = JSON.parse(JSON.stringify(cosmetics()));
  for (const piece of item.kind === "bundle" ? (item.contents || []) : [item]) {
    if (piece.kind === "badge") worn.badge = piece.style.emoji || "";
    else if (piece.kind === "number") worn.number = piece.style.number || "";
    else if (piece.kind === "celebration") worn.celebration = piece.style.effect || "";
    else if (piece.kind === "title") worn.title = {color:piece.style.color, label:(piece.style.label_i18n || {})[state.profile.language] || piece.style.label || ""};
    else worn[piece.kind] = piece.style;
  }
  state.preview = worn;
  state.previewName = item.name;
  applyCosmetics(worn);
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

function previewBar() {
  if (!state.preview) return "";
  const s = shopText(), worn = state.preview;
  return `<aside class="preview-bar" aria-label="${escapeHtml(s.preview)}"><b>${escapeHtml(s.preview)} · ${escapeHtml(state.previewName)}</b><div class="preview-person">${avatar(state.profile.user.name, worn.frame)}<div>${shirtTag(worn.number)}${escapeHtml(state.profile.user.name)} ${escapeHtml(worn.badge || "")}<div class="title-tag" style="color:${escapeHtml((worn.title || {}).color || 'var(--muted)')}">${escapeHtml((worn.title || {}).label || "—")}</div><div>${escapeHtml(SQUARES.wrong + SQUARES.correct + SQUARES.unused)}</div></div></div><p class="shop-note">${escapeHtml(s.previewHint)}</p><button class="btn ghost small" id="stop-preview">${escapeHtml(s.stop)}</button></aside>`;
}

function stopPreview() {
  state.preview = null;
  applyCosmetics(state.profile.cosmetics);
  render();
}

function shopSection(kind, items, heading = L.shopSections[kind] || kind, shelf = kind) {
  return `<div class="card shop-section" id="shelf-${escapeHtml(shelf)}">
    <div class="shop-section-heading"><h2>${escapeHtml(heading)}</h2><span>${String(items.length).padStart(2,"0")}</span></div>
    <div class="shop-grid${kind === "bundle" ? " wide" : ""}">${items.map(item => shopCell(kind, item)).join("")}</div>
  </div>`;
}

// Tre fasce e un colore ciascuna. Non e' un dato in piu' da tenere allineato: il server la
// ricava dal prezzo (services/shop.py), qui si sceglie solo come si vede.
const RARITY_COLOR = {free: "#8ea2b6", earned: "#38bd82", common: "#8ea2b6",
                      rare: "#4dc4ff", collector: "#f0c74e"};
const CELEBRATION_GLYPH = {spotlight: "🔦", confetti: "🎊", dust: "💨", flash: "📷",
                           paper: "📄", snow: "❄️", mud: "🟫", fireworks: "🎆"};

function rarityTag(item) {
  const rarity = item.rarity || "common";
  if (rarity === "free" || rarity === "common") return "";
  return `<span class="rarity" style="--rare-edge:${escapeHtml(RARITY_COLOR[rarity] || "#8ea2b6")}">${escapeHtml((L.rarity || {})[rarity] || rarity)}</span>`;
}

function shopPreview(kind, item) {
  const style = item.style || {};
  const name = (state.profile.user || {}).name || "Player";
  const caption = `<div class="preview-caption">${escapeHtml(L.shopPreview)}</div>`;
  if (kind === "theme") {
    // Un tema si vende mostrando il gioco, non il colore: prima qui c'era un campetto e una
    // pillola, cioe' una macchia, e una macchia a 25 stelle non la compra nessuno. Questa e'
    // la schermata vera in miniatura - percorso, tentativi, bottone - con le stesse tappe
    // per tutti i temi, cosi' l'unica variabile e' il tema.
    return `<div class="shop-stage" style="background-color:${escapeHtml(style.bg)};background-image:${escapeHtml(style.pattern || 'none')};color:${escapeHtml(style.text)}">
      ${caption}${themeShot(style)}
    </div>`;
  }
  if (kind === "frame") {
    return `<div class="shop-stage">${avatar(name, style)}<div class="preview-name">${escapeHtml(name)}</div>${caption}</div>`;
  }
  if (kind === "badge") return `<div class="shop-stage"><div class="emoji-preview">${escapeHtml(style.emoji || "—")}</div><div class="preview-name">${escapeHtml(name)} ${escapeHtml(style.emoji || "")}</div>${caption}</div>`;
  if (kind === "squares") {
    return `<div class="shop-stage">${caption}<div class="preview-name">Guess the Player · 2/3</div><div class="emoji-preview">${escapeHtml((style.wrong || "") + (style.correct || "") + (style.unused || ""))}</div></div>`;
  }
  if (kind === "title") {
    // Il titolo arriva col suo `label_i18n`: e' l'unico cosmetico fatto di parole.
    const label = (style.label_i18n && style.label_i18n[state.profile.language]) || style.label;
    return `<div class="shop-stage"><div class="preview-name">${escapeHtml(name)}</div><div class="title-tag" style="color:${escapeHtml(style.color || "var(--muted)")}">${escapeHtml(label || "—")}</div>${caption}</div>`;
  }
  if (kind === "number") {
    return `<div class="shop-stage">${caption}<div class="emoji-preview" style="font-variant-numeric:tabular-nums;font-weight:800">${escapeHtml(style.number || "—")}</div><div class="preview-name"><span class="shirt">${escapeHtml(style.number || "")}</span>${escapeHtml(name)}</div></div>`;
  }
  if (kind === "celebration") {
    return `<div class="shop-stage">${caption}<div class="emoji-preview">${escapeHtml(CELEBRATION_GLYPH[style.effect] || "—")}</div><div class="preview-name">${escapeHtml(item.name)}</div></div>`;
  }
  if (kind === "card") {
    // La figurina si guarda intera: qui e' la stessa cosa che disegna services/path_image.py,
    // in piccolo e in CSS. Le tre finiture non si possono raccontare a parole.
    return `<div class="shop-stage" style="padding:14px"><div class="fig-mini fig-${escapeHtml(style.finish || "plain")}" style="--paper:${escapeHtml(style.paper || "#0a131e")};--ink:${escapeHtml(style.ink || "#ecf2f8")};--glow:${escapeHtml(style.glow || "#38bd82")}">
      <span class="n">#412</span>
      <span class="sq"><i></i><i class="on"></i><i class="off"></i></span>
      <span class="sc">2/3</span>
    </div></div>`;
  }
  if (kind === "bundle" && item.contents && item.contents.length) {
    const byKind = k => (item.contents.find(piece => piece.kind === k) || {}).style || {};
    const theme = byKind("theme"), title = byKind("title"), squares = byKind("squares");
    const label = (title.label_i18n || {})[state.profile.language] || title.label || "";
    return `<div class="shop-stage" style="background-color:${escapeHtml(theme.bg || 'var(--bg)')};background-image:${escapeHtml(theme.pattern || 'none')};color:${escapeHtml(theme.text || 'var(--text)')};--accent:${escapeHtml(theme.accent || 'var(--text)')};--accent-text:${escapeHtml(theme.accentText || 'var(--bg)')}">
      ${caption}${avatar(name, byKind("frame"))}
      <div class="preview-name">${escapeHtml(name)} ${escapeHtml(byKind("badge").emoji || "")}</div>
      ${label ? `<div class="title-tag" style="color:${escapeHtml(title.color)}">${escapeHtml(label)}</div>` : ""}
      ${squares.correct ? `<div class="emoji-preview">${escapeHtml(squares.wrong + squares.correct + squares.unused)}</div>` : ""}
    </div>`;
  }
  return `<div class="emoji-preview">🎁</div>`;
}

// La miniatura di una partita, colorata da un tema. Le tappe sono finte ma plausibili:
// servono a far vedere come si legge un percorso su quel fondo, che e' la cosa che un tema
// puo' rovinare e che una macchia di colore non mostra.
const SHOT_STOPS = [["2011", "Santos"], ["2013", "Barcellona"], ["2017", "Paris SG"]];

function themeShot(style) {
  const edge = style.edge || "var(--edge)";
  const muted = style.muted || style.text;
  return `<div class="theme-shot" aria-hidden="true" style="--shot-edge:${escapeHtml(edge)};background:${escapeHtml(style.card || style.bg)}">
      <div class="bar" style="color:${escapeHtml(muted)}"><span>${escapeHtml(L.todayTitle)}</span><span style="color:${escapeHtml(style.accent)}">2/3</span></div>
      ${SHOT_STOPS.map(([year, club]) => `<div class="stop"><i style="background:${escapeHtml(style.accent)}"></i><span style="color:${escapeHtml(muted)}">${year}</span><b>${escapeHtml(club)}</b></div>`).join("")}
      <div class="box" style="color:${escapeHtml(muted)};text-align:center">${escapeHtml(L.placeholder)}</div>
      <div class="cta" style="background:${escapeHtml(style.accent)};color:${escapeHtml(style.accentText || style.bg)}">${escapeHtml(L.guessBtn)}</div>
    </div>`;
}

function shopCell(kind, item) {
  const s = shopText();
  let action;
  if (item.equipped) action = `<div class="tag">${escapeHtml(L.shopWorn)}</div>`;
  else if (item.owned && kind === "bundle") action = `<div class="tag">${escapeHtml(L.shopOwned)}</div>${item.equippable ? `<button class="btn ghost small" data-equip="${escapeHtml(item.id)}">${escapeHtml(s.wearAll)}</button>` : ""}`;
  else if (item.owned) {
    action = `<button class="btn ghost small" data-equip="${escapeHtml(item.id)}">${escapeHtml(L.shopWear)}</button>`;
  } else if (item.achievement) {
    action = `<div class="shop-note">${escapeHtml(s.earn)} · ${item.progress}/${item.achievement.target}</div><progress max="${item.achievement.target}" value="${item.progress}" aria-label="${escapeHtml(item.name)}"></progress>`;
  } else if (item.completes && item.completes.length) {
    const missing = item.completes.filter(piece => !piece.owned);
    action = `<div class="shop-note">${escapeHtml(L.completeMissing)}: ${missing.length}/${item.completes.length}</div><progress max="${item.completes.length}" value="${item.completes.length - missing.length}" aria-label="${escapeHtml(item.name)}"></progress>`;
  } else if (item.trophy) {
    action = `<div class="shop-note">${escapeHtml(L.podiumOnly)}</div>`;
  } else {
    action = `<button class="btn small" data-buy="${escapeHtml(item.id)}" aria-label="${escapeHtml(L.shopBuy + ' ' + item.name + ' · ' + item.price + ' ⭐')}">${escapeHtml(L.shopBuy)} · ${item.price} ⭐</button>`;
  }
  const partial = kind === "bundle" && item.price > 0 && item.price < item.full_price;
  const previewButton = (kind !== "bundle" || item.equippable) ? `<button class="shop-preview-trigger" data-try="${escapeHtml(item.id)}" aria-label="${escapeHtml(s.tryOn + ' · ' + item.name)}">${escapeHtml(s.tryOn)} <span aria-hidden="true">↗</span></button>` : "";
  return `<article class="shop-item${item.equipped ? " worn" : ""}${item.featured ? " featured" : ""}">
      <div class="shop-artwork">${rarityTag(item)}${shopPreview(kind, item)}${previewButton}</div>
      <div class="shop-product-head"><span class="shop-product-kind">${escapeHtml(L.shopSections[kind])}${item.featured ? ' / 05' : ''}</span><h3 class="nm">${escapeHtml(item.name)}</h3></div>
      <div class="ds"><details class="shop-product-details"><summary>${escapeHtml(s.details)}${kind === "bundle" ? ` · ${(item.contents || []).length} ${escapeHtml(s.included)}` : ''}</summary><p>${escapeHtml(item.description)}</p>${kind === "bundle" ? `<div class="pack-contents">${(item.contents || []).map(piece => `<span>${escapeHtml(piece.name)}</span>`).join("")}</div>` : ''}</details>
      ${item.achievement && item.owned ? `<p class="shop-unlocked">✧ ${escapeHtml(s.unlocked)}</p>` : ""}${partial ? `<p class="shop-completion"><b>${escapeHtml(s.partial)}</b><br>${escapeHtml(s.missing)}: ${(item.contents || []).filter(piece => !piece.owned).map(piece => escapeHtml(piece.name)).join(", ")}</p>` : ""}</div>
      <div class="shop-product-actions">${action}</div>
    </article>`;
}

const TABS = [
  { id: "play", icon: "🎯", label: () => L.play },
  { id: "archive", icon: "🗂", label: () => L.archive },
  { id: "stats", icon: "📊", label: () => L.stats },
  { id: "leagues", icon: "🏅", label: () => L.leagues },
  { id: "shop", icon: "🛍", label: () => L.shop },
];

function legalLinks() {
  const lang = encodeURIComponent((state.profile && state.profile.language) || clientLanguage());
  return `<footer class="legal-links"><a href="/privacy?lang=${lang}" target="_blank" rel="noopener">${escapeHtml(L.privacy)}</a><a href="/terms?lang=${lang}#refunds" target="_blank" rel="noopener">${escapeHtml(L.refunds)}</a></footer>`;
}

function render() {
  if (!state.profile) return;
  const body = state.publicTarget ? publicProfileView() : state.cabinetOpen ? cabinetView() : {
    play: playTab, archive: archiveTab, stats: statsTab, leagues: leaguesTab, shop: shopTab,
  }[state.tab]();
  const nav = TABS.map(tab => `<button data-tab="${tab.id}" aria-selected="${state.tab === tab.id}">
      <span class="icon">${tab.icon}</span><span>${escapeHtml(tab.label())}</span>
    </button>`).join("");

  document.getElementById("root").innerHTML =
    previewBar() + body + legalLinks() + `<nav>${nav}</nav>` + (state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : "");
  wire();
}

function showMessage(text) {
  document.getElementById("root").innerHTML = `<p class="error">${escapeHtml(text)}</p>` + legalLinks();
}

function syncMainButton() {
  /*
    Il bottone di sistema di Telegram: sta sopra la tastiera, e' quello che l'utente si
    aspetta di premere, e lascia alla pagina tutto lo spazio per il percorso. In pagina resta
    un bottone normale solo quando la pagina e' aperta fuori da Telegram.
  */
  if (!tg || !tg.MainButton) return;
  const canGuess = !!document.getElementById("answer");
  if (canGuess) {
    tg.MainButton.setText(L.guessBtn);
    tg.MainButton.show();
  } else {
    tg.MainButton.hide();
  }
}

function wire() {
  syncMainButton();
  document.querySelectorAll("[data-pin]").forEach(button => button.onclick = () => togglePin(button.dataset.pin));
  const openCabinet = document.getElementById("open-cabinet");
  if (openCabinet) openCabinet.onclick = () => { state.cabinetOpen = true; render(); window.scrollTo({top:0,behavior:"instant"}); };
  const closeCabinet = document.getElementById("close-cabinet");
  if (closeCabinet) closeCabinet.onclick = () => { state.cabinetOpen = false; render(); };
  document.querySelectorAll("[data-cabinet-filter]").forEach(button => button.onclick = () => {
    state.cabinetFilter = button.dataset.cabinetFilter;
    render();
  });
  document.querySelectorAll("[data-profile]").forEach(button => button.onclick = () => openPublicProfile(Number(button.dataset.profile)));
  const profileSearch = document.getElementById("profile-search");
  if (profileSearch) profileSearch.onsubmit = event => { event.preventDefault(); searchProfiles(); };
  const closeProfile = document.getElementById("close-profile");
  if (closeProfile) closeProfile.onclick = () => { state.publicTarget = null; render(); window.scrollTo(0,state.profileScroll); };
  const retryProfile = document.getElementById("retry-profile");
  if (retryProfile) retryProfile.onclick = () => openPublicProfile(state.publicTarget);
  document.querySelectorAll("[data-shop-view]").forEach(button => button.onclick = () => {
    state.shopView = button.dataset.shopView;
    state.shopKind = "all"; state.shopPrice = "all";
    if (state.shopView === "history") loadHistory();
    render();
  });
  for (const [id, field] of [["shop-kind","shopKind"],["shop-price","shopPrice"]]) {
    const input = document.getElementById(id);
    if (input) input.onchange = () => { state[field] = input.value; render(); };
  }
  const hideOwned = document.getElementById("shop-hide-owned");
  if (hideOwned) hideOwned.onchange = () => { state.shopHideOwned = hideOwned.checked; render(); };
  document.querySelectorAll("[data-try]").forEach(button => button.onclick = () => tryItem(button.dataset.try));
  const stop = document.getElementById("stop-preview");
  if (stop) stop.onclick = stopPreview;
  const save = document.getElementById("save-look");
  if (save) save.onclick = () => lookAction("save", document.getElementById("look-name").value);
  document.querySelectorAll("[data-use-look]").forEach(button => button.onclick = () => lookAction("wear",button.dataset.useLook));
  document.querySelectorAll("[data-delete-look]").forEach(button => button.onclick = () => lookAction("delete",button.dataset.deleteLook));
  const retry = document.getElementById("shop-retry");
  if (retry) retry.onclick = loadShop;
  const historyRetry = document.getElementById("history-retry");
  if (historyRetry) historyRetry.onclick = loadHistory;
  document.querySelectorAll("[data-copy-support]").forEach(button => button.onclick = async () => {
    const input = document.getElementById(`support-${button.dataset.copySupport}`);
    try { await navigator.clipboard.writeText(input.value); toast(shopText().copied); }
    catch (e) { input.focus(); input.select(); }
  });

  document.querySelectorAll("[data-tab]").forEach(button => {
    button.onclick = () => {
      state.tab = button.dataset.tab;
      state.publicTarget = null;
      state.feedback = null;
      state.hint = null;
      if (state.tab === "archive" && !state.calendar) loadCalendar();
      if (state.tab === "shop" && !state.shop) loadShop();
      render();
    };
  });

  const input = document.getElementById("answer");
  if (input) {
    input.onkeydown = event => { if (event.key === "Enter") submitGuess(); };
  }

  const submit = document.getElementById("submit");
  if (submit) submit.onclick = submitGuess;

  const hint = document.getElementById("hint");
  if (hint) hint.onclick = askHint;

  const showCard = document.getElementById("show-card");
  if (showCard) showCard.onclick = loadResultCard;
  const share = document.getElementById("share");
  if (share) share.onclick = () => {
    const url = state.feedback && state.feedback.share && state.feedback.share.url;
    if (url && tg) tg.openTelegramLink(url);
  };

  const back = document.getElementById("back");
  if (back) back.onclick = () => { state.archiveDay = null; state.feedback = null; loadCalendar(); render(); };

  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => openArchiveDay(button.dataset.day);
  });

  const create = document.getElementById("league-create");
  if (create) create.onclick = () => leagueAction("create", { name: document.getElementById("league-name").value });

  const join = document.getElementById("league-join");
  if (join) join.onclick = () => leagueAction("join", { code: document.getElementById("league-code").value });

  document.querySelectorAll("[data-leave]").forEach(button => {
    button.onclick = () => {
      if (window.confirm(L.leaveConfirm)) leagueAction("leave", { code: button.dataset.leave });
    };
  });

  document.querySelectorAll("[data-buy]").forEach(button => {
    button.onclick = () => buy(button.dataset.buy);
  });

  document.querySelectorAll("[data-equip]").forEach(button => {
    button.onclick = () => wear(button.dataset.equip);
  });

  document.querySelectorAll("[data-invite]").forEach(button => {
    button.onclick = () => {
      // `switchInlineQuery` apre il selettore delle chat di Telegram: e' il modo nativo di
      // invitare qualcuno, e non richiede di copiare un codice a mano.
      if (tg && tg.switchInlineQuery) tg.switchInlineQuery(button.dataset.invite, ["users", "groups"]);
      else toast(button.dataset.invite);
    };
  });
}

async function searchProfiles() {
  const input = document.getElementById("profile-query");
  const query = (input ? input.value : state.profileQuery).trim();
  state.profileQuery = query;
  state.profileSearchError = false;
  if (query.length < 2) { state.profileResults = null; render(); return; }
  state.profileSearchLoading = true; render();
  try {
    const result = await api("/app/api/profile/search", {query});
    state.profileResults = result.profiles || [];
  } catch (e) { state.profileResults = []; state.profileSearchError = true; }
  state.profileSearchLoading = false; render();
}

let mainButtonWired = false;

// Cosa succede sullo schermo quando la prendi. E' un canvas che vive due secondi e poi si
// toglie da solo: non c'e' niente da pulire e niente che resti in mezzo ai tocchi, perche'
// non riceve eventi. Chi ha chiesto meno animazioni non lo vede proprio (regola CSS).
const CELEBRATIONS = {
  spotlight: {count: 26, color: () => "#fff6d5", size: [3, 9], fall: -0.4, drift: 0},
  confetti:  {count: 90, color: i => ["#ff5a5a", "#3ddc84", "#4dc4ff", "#ffd028"][i % 4], size: [4, 10], fall: 2.4, drift: 1.2},
  dust:      {count: 60, color: () => "#c9bfa4", size: [2, 6], fall: -0.8, drift: 0.6},
  flash:     {count: 18, color: () => "#ffffff", size: [6, 16], fall: 0, drift: 0},
  paper:     {count: 70, color: () => "#f3ecd8", size: [5, 13], fall: 2.0, drift: 1.6},
  snow:      {count: 80, color: () => "#eaf6ff", size: [2, 6], fall: 1.1, drift: 0.8},
  mud:       {count: 55, color: i => ["#6b5a3a", "#9aa861"][i % 2], size: [3, 9], fall: 2.6, drift: 0.9},
  fireworks: {count: 70, color: i => ["#f2c74c", "#7fc4ff", "#ff9ce3"][i % 3], size: [3, 8], fall: -1.4, drift: 1.4},
};

function celebrate(effect) {
  const spec = CELEBRATIONS[effect];
  if (!spec || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const canvas = document.createElement("canvas");
  canvas.className = "celebration";
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  const bits = [];
  for (let i = 0; i < spec.count; i++) {
    bits.push({
      x: Math.random() * canvas.width,
      y: spec.fall >= 0 ? -Math.random() * canvas.height * 0.6 : canvas.height * (0.4 + Math.random() * 0.7),
      size: spec.size[0] + Math.random() * (spec.size[1] - spec.size[0]),
      vx: (Math.random() - 0.5) * spec.drift * 2,
      vy: spec.fall * (0.6 + Math.random()),
      color: spec.color(i),
    });
  }

  const started = performance.now();
  const step = now => {
    const life = (now - started) / 2000;
    if (life >= 1) { canvas.remove(); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = life < 0.75 ? 1 : (1 - life) * 4;
    for (const bit of bits) {
      bit.x += bit.vx;
      bit.y += bit.vy;
      ctx.fillStyle = bit.color;
      ctx.fillRect(bit.x, bit.y, bit.size, bit.size);
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// La figurina si chiede, non arriva da sola. Disegnarla ad ogni risposta giusta vorrebbe
// dire un PNG per ogni partita di ogni utente per far vedere un cosmetico a chi ce l'ha, e
// una bolla vuota a chi gioca con le immagini spente.
function resultCard() {
  if (state.card) {
    return `<div class="result-card"><img src="${escapeHtml(state.card)}" alt="${escapeHtml(L.share)}">
      <p class="shop-note" style="text-align:center;margin-top:8px">${escapeHtml(L.cardHint)}</p></div>`;
  }
  return `<button class="btn ghost" style="margin-top:8px" id="show-card"${state.cardLoading ? " disabled" : ""}>${escapeHtml(state.cardLoading ? L.loading : L.showCard)}</button>`;
}

async function loadResultCard() {
  const f = state.feedback;
  if (!f || state.cardLoading) return;
  state.cardLoading = true;
  render();
  try {
    const body = {
      attempts: f.attempts_used,
      max_attempts: f.max_attempts || (state.profile.today || {}).max_attempts,
      solved: f.status === "correct",
      hints: f.hints_used || 0,
      streak: (state.profile.user || {}).streak || 0,
    };
    if (state.archiveDay) body.day = state.archiveDay.day;
    const result = await api("/app/api/card", body);
    state.card = result.image;
  } catch (e) {
    toast(L.error);
  }
  state.cardLoading = false;
  render();
}

async function submitGuess() {
  const input = document.getElementById("answer");
  const answer = input && input.value.trim();
  if (!answer) return;

  const submit = document.getElementById("submit");
  if (submit) submit.disabled = true;

  try {
    const body = { answer };
    if (state.archiveDay) body.day = state.archiveDay.day;
    const result = await api("/app/api/guess", body);

    state.feedback = result;
    state.card = null;
    state.hint = null;
    haptic(result.status === "correct" ? "success" : "error");
    if (result.status === "correct") celebrate((cosmetics() || {}).celebration);

    // Lo stato del server e' l'unica verita' sui tentativi rimasti: si ricarica invece di
    // contarli qui, altrimenti due schede aperte si raccontano numeri diversi.
    if (state.archiveDay) await openArchiveDay(state.archiveDay.day, { keepFeedback: true });
    else await loadProfile({ keepFeedback: true, lightweight: result.status === "wrong" });
  } catch (e) {
    toast(L.error);
    if (submit) submit.disabled = false;
  }
}

async function askHint() {
  try {
    const result = await api("/app/api/hint");
    if (result.status === "ok") {
      haptic("warning");
      // L'indizio non si tiene qui: torna dal profilo dentro `hints.taken`, cosi' c'e'
      // anche riaprendo l'app domani mattina.
      await loadProfile({ keepFeedback: true, lightweight: true });
    } else {
      toast(L.noHints);
    }
  } catch (e) {
    toast(L.error);
  }
}

// --- negozio ----------------------------------------------------------------

async function loadShop() {
  state.shopError = false;
  try {
    state.shop = await api("/app/api/shop");
  } catch (e) {
    state.shopError = true;
  }
  render();
}

async function loadHistory() {
  state.historyError = false;
  try { state.history = await api("/app/api/shop/history"); }
  catch (e) { state.historyError = true; }
  render();
}

async function lookAction(action, name) {
  try {
    const result = await api("/app/api/shop/look", {action, name});
    if (result.status !== "ok") { toast(shopText()[result.status] || L.shopErrors[result.status] || L.error); return; }
    if (action === "wear") { state.preview = null; await loadProfile(); }
    await loadShop();
    if (action === "save") toast(shopText().saved);
  } catch (e) { toast(L.error); }
}

function ownedInShop(itemId) {
  if (!state.shop) return false;
  const everything = state.shop.bundles.concat(
    ...state.shop.sections.map(section => section.items)
  );
  const found = everything.find(item => item.id === itemId);
  return !!(found && found.owned);
}

async function buy(itemId) {
  if (state.buying || ownedInShop(itemId)) return;
  state.buying = true;
  /*
    Il pagamento lo apre Telegram (`openInvoice`), la consegna la fa il **bot** quando
    Telegram gli manda il pagamento sul webhook: questa pagina non scrive niente, altrimenti
    basterebbero gli strumenti di sviluppo per regalarsi la collezione completa.

    Fra il "pagato" che vede l'utente e la consegna passa il tempo di un giro di webhook,
    quindi si ricarica la vetrina finche' l'oggetto non compare (o finche' non ci si stanca:
    ce l'ha comunque, si vede riaprendo).
  */
  try {
    const result = await api("/app/api/shop/buy", { item: itemId });
    if (result.status !== "ok") { state.buying = false; toast(L.shopErrors[result.status] || L.error); await loadShop(); return; }
    if (!tg || !tg.openInvoice) { state.buying = false; toast(L.error); return; }

    tg.openInvoice(result.link, async status => {
      state.buying = false;
      if (status !== "paid") {
        if (status === "failed") toast(L.error);
        return;
      }
      haptic("success");
      toast(L.shopWaiting);
      for (let attempt = 0; attempt < 5 && !ownedInShop(itemId); attempt++) {
        await new Promise(done => setTimeout(done, 900));
        await loadShop();
      }
      await loadProfile();
      toast(ownedInShop(itemId) ? L.shopThanks : shopText().waiting);
    });
  } catch (e) {
    state.buying = false;
    toast(L.error);
  }
}

async function wear(itemId) {
  try {
    const result = await api("/app/api/shop/equip", { item: itemId });
    if (result.status !== "ok") { toast(L.shopErrors[result.status] || L.error); return; }
    haptic("success");
    state.preview = null;
    if (state.profile) state.profile.cosmetics = result.cosmetics;
    applyCosmetics(result.cosmetics);
    await loadShop();
  } catch (e) {
    toast(L.error);
  }
}

async function leagueAction(action, body) {
  try {
    const result = await api("/app/api/league", Object.assign({ action }, body));
    if (result.status !== "ok") { toast(L.leagueErrors[result.status] || L.error); return; }
    await loadProfile();
    render();
  } catch (e) {
    toast(L.error);
  }
}

async function openArchiveDay(day, options) {
  try {
    state.archiveDay = await api("/app/api/calendar", { day });
    if (!(options && options.keepFeedback)) state.feedback = null;
    render();
  } catch (e) {
    toast(L.error);
  }
}

async function loadCalendar() {
  try {
    const data = await api("/app/api/calendar");
    state.calendar = data.days || [];
    render();
  } catch (e) {
    state.calendar = [];
    render();
  }
}

async function loadProfile(options) {
  const feedback = state.feedback;
  const hint = state.hint;
  const lightweight = !!(options && options.lightweight && state.profile);
  const profile = await api("/app/api/me", lightweight ? { lightweight: true } : undefined);
  state.profile = mergeProfile(state.profile, profile, lightweight);
  // La lingua e' quella scelta con /language, non quella del client: chi ha impostato lo
  // spagnolo nel bot deve trovarlo anche qui.
  L = T[state.profile.language] || L;
  // Prima del disegno: il tema comprato deve valere gia' per la prima schermata, non
  // arrivare come un lampo di colore dopo.
  applyCosmetics(state.preview || state.profile.cosmetics);
  if (options && options.keepFeedback) state.feedback = feedback;
  if (options && options.keepHint) state.hint = hint;
  render();
}

async function start() {
  if (!(tg && tg.initData)) { showMessage((T[clientLanguage()] || T.en).error); return; }
  if (tg.MainButton && !mainButtonWired) {
    // Si registra una volta sola: `onEvent` accumula i gestori, e due chiamate vorrebbero
    // dire due tentativi consumati per una pressione.
    tg.MainButton.onClick(submitGuess);
    mainButtonWired = true;
  }
  try {
    await loadProfile();
  } catch (e) {
    showMessage(e.status === 404 ? L.notRegistered : L.error);
  }
}

start();
</script>
</body>
</html>
