name: Restore verification

# Prova periodica del ripristino (#50): backup -> validazione -> restore -> confronto, con gli
# stessi script che userebbe un operatore, su un Firestore vero ma isolato (l'emulatore, due
# progetti demo- che non esistono su GCP). I dati sono sintetici ma con la forma di quelli di
# produzione (tests/test_backup_restore_emulator.py): un artifact reale conterrebbe dati
# personali che in CI non servono.
#
# Serve ad accorgersi se la meccanica di restore si rompe anche nelle settimane in cui nessuno
# tocca il codice (una nuova versione dell'emulatore o del client, un tipo di valore nuovo).
# Non usa credenziali, non ha accesso a GCP e non puo' in alcun modo scrivere in produzione.
# Procedura: docs/backup-recovery.md.
on:
  schedule:
    - cron: "0 5 * * 2"   # ogni martedi' alle 05:00 UTC, il giorno dopo il backup settimanale
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Avvia l'emulatore Firestore
        run: |
          gcloud components install cloud-firestore-emulator --quiet
          nohup gcloud emulators firestore start --host-port=127.0.0.1:8571 > /tmp/firestore.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8571/; then
              echo "emulatore pronto"
              exit 0
            fi
            sleep 1
          done
          echo "l'emulatore non e' partito entro 60 secondi"
          cat /tmp/firestore.log
          exit 1

      - name: Backup, restore e confronto (round trip completo, ripetuto)
        env:
          # Il fixture fallisce (non salta) senza emulatore quando CI e' impostata.
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8571
        run: |
          for run in 1 2 3; do
            echo "round trip $run"
            pytest -q -p no:cacheprovider tests/test_backup_restore_emulator.py \
              tests/test_backup_format.py tests/test_backup_restore_safety.py tests/test_backup_inventory.py
          done

      # Se un passo fallisce: avviso diretto all'admin su Telegram (#228). Con curl e non con Python,
      # cosi' funziona anche quando e' l'installazione a rompersi. Senza ALERT_TELEGRAM_BOT_TOKEN e
      # ALERT_TELEGRAM_CHAT_ID non fa nulla. Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>Gioco · %s fallito</b> · job %s\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true
