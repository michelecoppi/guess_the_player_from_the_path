name: Deploy

# Parte solo dopo che il workflow CI e' andato a buon fine su main: niente deploy di codice
# che non ha passato i test. Vedi docs/deploy.md per il setup di Workload Identity Federation
# (WIF_PROVIDER / WIF_SERVICE_ACCOUNT) richiesto perche' questo job possa autenticarsi su GCP.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy su Cloud Run
        # --max-instances non e' un dettaglio di costo: il limite di frequenza delle API
        # della mini app (services/rate_limit.py) e' un token bucket **per processo**,
        # quindi il budget di un utente si moltiplica per il numero di repliche. Senza un
        # tetto il limite dice poco, ed e' scritto anche in docs/performance.md.
        # Dieci istanze sono abbondanti per il carico di questo bot e tengono il budget
        # massimo di un utente entro un ordine di grandezza noto.
        run: |
          gcloud run deploy guess-the-player \
            --source . \
            --project guess-the-player-from-path-bot \
            --region europe-west1 \
            --max-instances 10 \
            --quiet
