name: Generazione automatica giornaliera

on:
  schedule:
    # 23:15 UTC = poco dopo mezzanotte a Roma sia in CET (UTC+1) che in CEST (UTC+2)
    - cron: "15 23 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Scrivi le credenziali Firebase
        run: echo "$FIREBASE_CREDENTIALS_JSON" > firebase-key.json
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

      - name: Genera sfida giornaliera ed eventi
        env:
          FIREBASE_CREDENTIALS_PATH: firebase-key.json
        run: python scripts/generate_content.py

      - name: Rimuovi le credenziali
        if: always()
        run: rm -f firebase-key.json

      - name: Sveglia il bot (Render free tier)
        if: always()
        run: curl -fsS --max-time 20 "${{ secrets.BOT_PING_URL }}" || echo "Ping fallito o non configurato, non bloccante"
