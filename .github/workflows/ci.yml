name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Controllo sintassi
        run: python -m py_compile bot.py config.py services/*.py handlers/*.py scripts/*.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy su services/)
        run: mypy services/

      - name: Valida i dataset JSON
        run: |
          python -c "
          import json
          for f in ['data/players.json', 'data/config.json', 'data/event_templates.json']:
              json.load(open(f, encoding='utf-8'))
              print(f, 'OK')
          "

      - name: Controlla integrita e salute del dataset calciatori
        run: python scripts/dataset_report.py --strict

      - name: Esegui i test (con coverage)
        run: pytest -q --cov=services --cov=handlers --cov-report=term-missing --cov-fail-under=50
