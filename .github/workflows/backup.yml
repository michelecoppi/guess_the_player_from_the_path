name: Backup Firestore

# Export settimanale del database in un artifact (formato v2, tipizzato e validato). L'export
# gestito di Firestore richiede il piano Blaze e un bucket; il database qui e' piccolo e un JSON
# alla settimana e' un backup che si legge e si ripristina con scripts/restore_firestore.py.
# Procedura, copertura e punti di ripristino: docs/backup-recovery.md.
#
# L'autenticazione e' la stessa del deploy (Workload Identity Federation, WIF_PROVIDER /
# WIF_SERVICE_ACCOUNT): nessuna chiave di servizio nei secret. Il service account deve poter
# leggere Firestore (ruolo roles/datastore.viewer, sola lettura).
#
# Un file che non supera la validazione non viene caricato: lo script non lo rinomina nemmeno
# da `.partial`, e il passo di validazione indipendente fallisce prima dell'upload. Nei log
# finiscono solo metadati e conteggi, mai il contenuto dei documenti.
on:
  schedule:
    - cron: "30 3 * * 1"   # ogni lunedi' alle 03:30 UTC
  workflow_dispatch:        # e a mano, quando serve una copia prima di toccare i dati

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: guess-the-player-from-path-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Esporta Firestore
        # Senza file di chiave services/firebase_service.py ripiega sulle credenziali
        # dell'ambiente, che qui sono quelle appena ottenute con WIF.
        run: python scripts/backup_firestore.py --out backup --project "$GOOGLE_CLOUD_PROJECT" --quiet

      - name: Valida il backup (indipendente dall'export)
        id: validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(backup/firestore-*.json)
          if [ "${#files[@]}" -ne 1 ] || compgen -G "backup/*.partial" > /dev/null; then
            echo "atteso esattamente un backup valido in backup/" >&2
            exit 1
          fi
          python scripts/restore_firestore.py validate "${files[0]}" \
            --expect-source-project "$GOOGLE_CLOUD_PROJECT" > backup-validation.txt
          {
            echo "### Firestore backup"
            echo '```'
            cat backup-validation.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "name=firestore-backup-$(date -u +%Y%m%dT%H%M%SZ)-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.validate.outputs.name }}
          path: backup/firestore-*.json
          if-no-files-found: error
          # Un anno di copie settimanali: abbastanza per accorgersi di un danno fatto mesi
          # prima, che e' il caso in cui un backup serve davvero.
          retention-days: 365

      # Dopo l'upload, di proposito: una collezione che nessuno ha classificato viene esportata
      # comunque (meglio averla), ma il run diventa rosso finche' services/firestore_backup/inventory.py
      # non la classifica.
      - name: Controlla che l'inventario copra tutte le collezioni
        run: python scripts/restore_firestore.py validate backup/firestore-*.json --strict
