name: Release check

# Runs only when a release tag is pushed (vX.Y.Z), see docs/release-checklist.md. This is
# NOT a second test suite: by policy a tag is only ever created on a commit whose CI run
# is already green (see docs/release-checklist.md § Exact-commit requirement), so this
# workflow does not rebuild, lint or test the app. It validates release *metadata* on that
# exact commit: VERSION matches the tag and CHANGELOG.md has a dated entry for it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verifica VERSION e CHANGELOG.md per il tag
        run: python -m tools.release check --tag "${GITHUB_REF_NAME}"

      # Se un passo fallisce: avviso diretto all'admin su Telegram (#228). Con curl e non con Python,
      # cosi' funziona anche quando e' l'installazione a rompersi. Senza ALERT_TELEGRAM_BOT_TOKEN e
      # ALERT_TELEGRAM_CHAT_ID non fa nulla. Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>Gioco · %s fallito</b> · job %s\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true
